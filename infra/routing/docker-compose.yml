services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:26.10-debian
    container_name: kulha-osrm-morocco
    command: ["osrm-routed", "--algorithm", "mld", "--ip", "0.0.0.0", "--port", "5000", "/data/morocco-latest.osrm"]
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped